name: Update Shiller data

on:
  schedule:
    # Weekly, Tuesday 13:00 UTC. Shiller refreshes irregularly; weekly is ample
    # for a monthly series and keeps us well inside GitHub's 60-day cron window.
    - cron: "0 13 * * 2"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # This job deliberately uses ONLY GitHub-owned actions. A job's actions are
      # all resolved during "Set up job", before any step runs, so a third-party
      # action that the repo's Actions policy disallows fails the ENTIRE job in
      # ~2s -- and continue-on-error cannot save it, because no step ever ran.
      # That is exactly how the first two runs of this pipeline died. Keepalive
      # therefore lives in keepalive.yml, where it can only break itself.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "xlrd==2.0.*"

      # build_data.py exits non-zero on ANY anomaly: link not found on
      # shillerdata.com, a column it cannot map, too few records, CAPE outside a
      # sane range, or a feed that would regress. A failure here emails the repo
      # owner, which is the whole point -- the feed this replaces died silently.
      - name: Build JSON feed
        run: python3 scripts/build_data.py --out data

      - name: Show result
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/stock_market_data.json"))
          m = d["metadata"]
          print("records:", m["total_records"], "latest:", m["latest_date"])
          print("last_updated:", m["last_updated"])
          print("latest CAPE:", d["data"][-1]["cape"])
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "Update Shiller data ($(date -u +%Y-%m-%d))"
            git push
            echo "Committed and pushed."
          else
            # last_updated is datetime.now(), so a successful build ALWAYS
            # changes the file. Reaching this branch means the build step did
            # not actually write -- treat it as a failure, not a quiet no-op.
            echo "::error::No diff in data/ after a successful build. last_updated should change on every run; something did not write."
            exit 1
          fi
